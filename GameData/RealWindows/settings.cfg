// Real Windows settings - read once per game launch.
//
// There is NO per-part configuration: windows are found from each part's own
// textures and IVA. excludeParts is only an escape hatch for broken IVAs.

RealWindows
{
    enabled = True

    toggleKey = Alt+F8             // switches Real Windows on and off in flight ("None": no key). Alt/Ctrl/Shift + a Unity KeyCode
    startEnabled = True            // on or off at the start of each flight scene

    // ---- scope -----------------------------------------------------------
    maxDistance = 150              // m: interiors are rendered for parts closer than this
    occluderDistance = 400         // m: parts closer than this occlude windows behind them
    maxInteriors = 32              // nearest N interiors per frame
    includeInactiveVessels = True  // other loaded vessels (docking targets, stations)
    createMissingInteriors = True  // instantiate IVAs stock hasn't (inactive vessels, empty cabins)
    createPerFrame = 1             // spread instantiation hitches
    excludeParts =                 // pipe-separated part names with broken/leaky IVAs

    // ---- alignment -------------------------------------------------------
    // Each part's interior is mapped from the part's LIVE transform every frame.
    // Parts whose maps agree within these tolerances share one interior render
    // (normally the whole rigid vessel). 0 / 0 = render every part separately.
    groupPositionTolerance = 0.002 // m
    groupAngleTolerance = 0.05     // deg

    // ---- rendering -------------------------------------------------------
    renderScale = 1                // offscreen resolution relative to the screen
    interiorRenderingPath = Forward
    compositeEvent = AfterForwardOpaque   // or BeforeImageEffects / AfterForwardAlpha
    useSceneDepth = True           // terrain/buildings in front hide windows (needs camera depth texture)
    aimIvaSunPerGroup = True       // sunlight direction correct for every vessel's interiors
    minWindowPixels = 12           // windows smaller than this on screen (px) aren't rendered
    interiorShadows = True         // shadows inside interiors; False saves a whole shadow pass
    interiorRefresh = 1            // s: the interiors' shell and props are cached and redrawn when the view changes, else this often
                                   // (lighting, animated props); 0 = only when the view changes, -1 = no cache (all redrawn every frame)
    interiorRedrawMove = 0.0005    // m the camera may move relative to an interior before the cache is redrawn
    interiorRedrawTurn = 0.01      // deg it may turn before the cache is redrawn
    kerbalShadows = False          // shadows in the per-frame kerbals pass (costs a second shadow pass every frame)
    renderNeighbours = True        // attached parts' interiors are rendered too, so open hatches look into the next part
    showInteriorWhenInside = True  // zooming the camera into a part shows its interior whole, like the stock overlay
    ivaView = True                 // also in IVA: other parts' windows, seen through the IVA's windows, show their interiors
    centrifugeDeployTwist = False  // experimental: with SSPX's own centrifuge module (Kerbalism replaces it), turn the interior with
                                   // ring sections the deploy animation slides (the 'Mercury'); also seen in IVA
    insideRedraw = True            // ...and draws it again after clouds/atmosphere, which otherwise paint over it
    insideCompositeEvent = AfterForwardAlpha   // when that second draw runs (a Unity CameraEvent)
    maxUvTiles = 16                // sub-meshes with UVs outside 0..1 are baked per UV tile; more tiles than this: no mask
    seeIntoNeighbours = True       // windows show the next part's interior through open hatches (False: only their own part's)
    seeThroughWindows = True       // looking through a cabin and out of its far window shows what is behind it: another part's
                                   // interior through its window, or the scene (through real glass, or a cut-out below)
    seeThroughHoles = True         // painted windows looked through become cut-outs in the main render, so the scene behind
                                   // them is the real one (terrain, parts, vessels; not sky effects: see the readme)
    seeThroughHoleParts = 12       // ...for at most this many parts, nearest first (the rest stay dark there)
    hideDepthMasks = True          // interior depth masks (FreeIva hatch doorways, window plugs) are left out of the interior render

    // ---- look ------------------------------------------------------------
    transmission = 0.85            // 1 = clear glass, lower keeps more of the painted window
    glassTint = 0.92, 0.96, 1.0
    feather = 1                    // px of edge softening
    glassReflection = 1            // x Fresnel: more reflection (painted window) at grazing angles; 0 = none
    glassSpecular = 1              // sun glint strength; 0 = none
    glassSmoothness = 0.85         // 0-1: glint size, 1 = pin-point
    glassDirt = 0.3                // smudges and dust; 0 = spotless
    glassDirtScale = 3             // smudges per metre

    // ---- window regions ----------------------------------------------------
    // Once per part type: lightmap and gloss propose regions, the IVA confirms
    // them, and each confirmed region fills its pane's mesh or grows over its
    // colour to the painted frame.
    //   Off    - no texture data: IVA probe per pixel
    //   Assist - regions need an IVA opening behind them. Where a texture has a
    //            lightmap, it decides: gloss alone proposes nothing there.
    //   Union  - Assist, plus any IVA opening counts as a window
    //   Trust  - every region is a window, no IVA check
    // Parts with no usable lightmap or gloss use the IVA probe per pixel.
    materialMode = Assist
    lightThreshold = 0.5           // lightmap value counted as lit
    lightMinFraction = 0.0005      // a lightmap is used only if at least this much of it is lit
    glassThreshold = 0.4           // gloss value that makes a texel a candidate
    glassMinFraction = 0.002       // a gloss map is used only if this ...
    glassMaxFraction = 0.7         // ... to this fraction of it is marked (also the lightmap's upper limit)
    regionMinOpen = 0.5            // share of an unlit or neutral region that needs an IVA opening right behind it
    regionMinOpenLit = 0.02        // share of a lit, tinted region with an opening behind or near it
    tintThreshold = 8              // blue minus red (0-255) that makes a region's colour glass-like
    colourTolerance = 18           // 0-255 per channel: largest colour step inside one window.
                                   // Too small: window stops short of its frame. Too large: leaks past the frame.
    growLimit = 0.75               // how far a region may grow, x sqrt(region area)
    islandFill = 0.8               // a region this share of its UV island takes the whole island (a pane's own mesh)
    maskResolution = 1024          // max texels per side of a window mask
    dumpMasks = False              // write masks to PluginData/masks (R window, G IVA opening, B lightmap/gloss)

    // ---- IVA probe ---------------------------------------------------------
    probeOpenFraction = 0.12       // share of the view points (seat eyes) that must see through a hull point
    probeWallMargin = 0.1          // m: IVA surface this close past the hull still counts as wall
    probeResolution = 128          // px per face, per view point (baked once per IVA type)
    hullEpsilon = 0.25             // how far interior may poke out of the hull
    sceneDepthEpsilon = 0.15

    // ---- debug -----------------------------------------------------------
    debugMode = 0                  // 0 off, 1 window mask (yellow shown, red = no interior behind), 2 part IDs, 3 x-ray, 4 interior only, 5 window verdict (lime = mask, green = probe, cyan = rejected region, blue = solid)
    debugCycleKey = None           // a key (Unity KeyCode, e.g. KeypadDivide) that cycles debugMode in flight
    alignmentDumpKey = None        // a key (e.g. KeypadMultiply) that writes per-part alignment info to KSP.log
    verboseLogging = False
    flipY = 0                      // set 1 only if the effect appears vertically mirrored
}
