// Real Windows settings - read once per game launch.
//
// Windows are found from each part's own textures and interior; there is no
// per-part configuration. Every key is optional: a missing one keeps its default.

RealWindows
{
    // ---- on / off ----------------------------------------------------------
    toggleKey = Alt+F8             // switches Real Windows on and off in flight ("None": no key). Alt/Ctrl/Shift + a Unity KeyCode
    startEnabled = True            // on or off at the start of each flight scene

    // ---- performance -------------------------------------------------------
    maxDistance = 150              // m: interiors are shown for parts closer than this
    maxInteriors = 32              // at most this many interiors per frame, nearest first
    includeInactiveVessels = True  // also other loaded vessels (docking targets, stations, EVA)
    propDetailPixels = 160         // props are drawn while a part's windows are at least this big on screen (px); 0 = always
    crewDetailPixels = 48          // crew moves every frame from this size; smaller, it is updated about once a second; 0 = always
    interiorScale = 1              // resolution of the interior seen through windows (0.1-1); window outlines stay sharp
    interiorShadows = True         // shadows inside interiors
    kerbalShadows = False          // shadows cast by the crew (costs an extra shadow pass every frame)
    interiorRefresh = 1            // s: a still view of the cabin is redrawn this often (lights, screens); 0 = only when the view changes

    // ---- features ----------------------------------------------------------
    renderNeighbours = True        // open hatches look into the next part's interior
    seeThroughWindows = True       // looking through a cabin and out of its far window shows what is behind it. Sky effects
                                   // (atmosphere, clouds, sun flares) don't show through the far side of painted windows
    showInteriorWhenInside = True  // zooming the camera into a part shows its interior whole
    ivaView = True                 // in IVA, other parts' windows seen through your windows show their interiors

    // ---- glass -------------------------------------------------------------
    transmission = 0.85            // 1 = clear glass, lower keeps more of the painted window
    glassTint = 0.92, 0.96, 1.0
    glassReflection = 1            // reflection at grazing angles; 0 = none
    glassSpecular = 1              // sun glint strength; 0 = none
    glassSmoothness = 0.85         // 0-1: glint size, 1 = pin-point
    glassDirt = 0.3                // smudges and dust; 0 = spotless
    glassDirtScale = 3             // smudges per metre

    // ---- troubleshooting ---------------------------------------------------
    excludeParts =                 // part names whose interiors look broken from outside, separated by |
    flipY = 0                      // set 1 only if the effect appears upside down
    debugCycleKey = None           // a key (Unity KeyCode, e.g. KeypadDivide) that cycles the debug views in flight
    verboseLogging = False         // more detail in KSP.log, for bug reports
}
